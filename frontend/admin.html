<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CYBER Admin Control Panel</title>
  <style>
    body { background: #090d16; color: #e2e8f0; font-family: sans-serif; padding: 2rem; }
    .container { max-width: 700px; margin: 0 auto; background: #1e293b; padding: 2rem; border-radius: 12px; }
    h1 { color: #38bdf8; text-align: center; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; color: #94a3b8; }
    input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #10b981; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background: #059669; }
    table { width: 100%; margin-top: 2rem; border-collapse: collapse; }
    th, td { border: 1px solid #334155; padding: 10px; text-align: left; }
    th { background: #0f172a; color: #38bdf8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>CYBER Admin Panel</h1>

    <div class="form-group">
      <label>Admin Secret Password</label>
      <input type="password" id="adminPass" placeholder="Enter Admin Password">
    </div>

    <div class="form-group">
      <label>Select Key Custom Duration</label>
      <select id="duration">
        <option value="1">1 Hour Trial</option>
        <option value="24" selected>24 Hours (1 Day)</option>
        <option value="168">7 Days</option>
        <option value="720">30 Days</option>
      </select>
    </div>

    <button onclick="createKey()">Generate New Custom Key</button>

    <h2>Generated Key Database</h2>
    <button onclick="loadKeys()" style="background: #0284c7; margin-bottom: 10px;">Refresh Key List</button>

    <table>
      <thead>
        <tr>
          <th>Generated Key</th>
          <th>Expires At</th>
        </tr>
      </thead>
      <tbody id="keyTable"></tbody>
    </table>
  </div>

  <script>
    // UPDATED NEW BACKEND LINK
    const BACKEND_URL = "https://cyber-x-silent-server.onrender.com";

    async function createKey() {
      const adminPass = document.getElementById('adminPass').value;
      const durationHours = document.getElementById('duration').value;

      const res = await fetch(`${BACKEND_URL}/api/admin/create-key`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ adminPass, durationHours })
      });

      const data = await res.json();
      if (data.success) {
        alert(`Success! New Key Created: ${data.record.key}`);
        loadKeys();
      } else {
        alert(data.error || "Failed to create key");
      }
    }

    async function loadKeys() {
      const adminPass = document.getElementById('adminPass').value;
      const res = await fetch(`${BACKEND_URL}/api/admin/list-keys`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ adminPass })
      });

      const data = await res.json();
      if (data.keys) {
        const table = document.getElementById('keyTable');
        table.innerHTML = data.keys.map(k => `
          <tr>
            <td style="font-family: monospace; color:#38bdf8; font-weight:bold;">${k.key}</td>
            <td>${new Date(k.expiresAt).toLocaleString()}</td>
          </tr>
        `).join('');
      } else {
        alert("Unauthorized password or failed to load keys.");
      }
    }
  </script>
</body>
</html>
