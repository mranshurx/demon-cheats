<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER X SILENT — Admin Control Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #030712; color: #f3f4f6; min-height: 100vh; padding: 2rem; background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #030712 80%); }
    .container { max-width: 800px; margin: 0 auto; background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 2.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }

    h1 { font-size: 2rem; font-weight: 800; color: #fff; background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 2rem; }

    .hidden { display: none !important; }
    .form-group { margin-bottom: 1.25rem; text-align: left; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #9ca3af; margin-bottom: 0.5rem; }
    input, select, textarea { width: 100%; padding: 0.85rem 1rem; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(3, 7, 18, 0.6); color: #fff; font-size: 0.95rem; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #38bdf8; }

    .btn { width: 100%; padding: 1rem; border-radius: 12px; border: none; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
    .btn-login { background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%); color: #fff; margin-top: 1rem; }
    .btn-create { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #fff; margin-top: 0.5rem; }
    .btn-maintenance { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #fff; margin-top: 0.75rem; }
    .btn-revoke { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); padding: 0.4rem 0.8rem; font-size: 0.75rem; border-radius: 8px; width: auto; }
    .btn-revoke:hover { background: rgba(239, 68, 68, 0.4); }

    .section-card { background: rgba(3, 7, 18, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 1.5rem; margin-bottom: 2rem; }
    .section-title { font-size: 1rem; font-weight: 700; color: #38bdf8; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }

    table { width: 100%; border-collapse: collapse; margin-top: 1rem; border-radius: 12px; overflow: hidden; }
    th, td { padding: 0.9rem 1rem; text-align: left; font-size: 0.82rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    th { background: rgba(3, 7, 18, 0.8); color: #38bdf8; font-weight: 700; }
    td { background: rgba(17, 24, 39, 0.4); }
    .key-code { font-family: monospace; font-weight: 700; color: #4ade80; }
    .badge { display: inline-block; padding: 0.25rem 0.6rem; border-radius: 99px; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
    .badge-active { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.35); }
    .badge-expired { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.35); }
    .key-count { font-size: 0.8rem; color: #9ca3af; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <h1>CYBER ADMIN PANEL</h1>

    <!-- LOGIN VIEW -->
    <div id="loginView">
      <div class="form-group">
        <label>Admin Secret Password</label>
        <input type="password" id="adminPassInput" placeholder="Enter Admin Password">
      </div>
      <button class="btn btn-login" onclick="adminLogin()">Access Admin Dashboard</button>
      <div id="loginError" style="color: #f87171; font-size: 0.85rem; margin-top: 1rem; text-align: center;"></div>
    </div>

    <!-- ADMIN DASHBOARD VIEW -->
    <div id="adminDashboard" class="hidden">

      <!-- MAINTENANCE MODE CONTROL SECTION -->
      <div class="section-card">
        <div class="section-title">Maintenance Mode Control</div>
        <div class="form-group">
          <label>Status</label>
          <select id="maintStatus">
            <option value="false">OFF (Normal Operation)</option>
            <option value="true">ON (Maintenance Active)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Maintenance Custom Message</label>
          <textarea id="maintMessage" rows="3" placeholder="Write message shown to users when maintenance is ON..."></textarea>
        </div>
        <button class="btn btn-maintenance" onclick="updateMaintenance()">Save & Apply Maintenance State</button>
      </div>

      <!-- KEY GENERATOR SECTION -->
      <div class="section-card">
        <div class="section-title">Generate Access Key</div>
        <div class="form-group">
          <label>Key Validity Duration</label>
          <select id="duration">
            <option value="1">1 Hour Trial</option>
            <option value="24" selected>24 Hours (1 Day)</option>
            <option value="168">7 Days</option>
            <option value="720">30 Days</option>
          </select>
        </div>
        <button class="btn btn-create" onclick="createKey()">Generate New Key</button>
      </div>

      <!-- ALL KEYS TABLE -->
      <div class="section-card">
        <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
          <span>All Database Keys <span id="keyCount" class="key-count"></span></span>
          <button onclick="loadDashboardData()" style="width: auto; padding: 0.4rem 1rem; background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 8px; font-size: 0.8rem; cursor: pointer;">Refresh List</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Generated Key</th>
              <th>Status</th>
              <th>Created</th>
              <th>Expires At</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="keyTable">
            <tr><td colspan="5" style="text-align:center; color:#6b7280;">Loading keys...</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <script>
    const BACKEND_URL = "https://cyber-x-silent-server.onrender.com";
    let storedAdminPass = "";

    async function adminLogin() {
      const pass = document.getElementById('adminPassInput').value.trim();
      const errBox = document.getElementById('loginError');
      errBox.innerText = "";

      if (!pass) {
        errBox.innerText = "Please enter the admin password.";
        return;
      }

      try {
        const res = await fetch(`${BACKEND_URL}/api/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ adminPass: pass })
        });
        const data = await res.json();

        if (data.success) {
          storedAdminPass = pass;
          document.getElementById('loginView').classList.add('hidden');
          document.getElementById('adminDashboard').classList.remove('hidden');
          loadDashboardData();
        } else {
          errBox.innerText = "Invalid Admin Password! (Hint: ANSHU-BHAI-CYBER)";
        }
      } catch (err) {
        errBox.innerText = "Connection error to backend server.";
      }
    }

    async function loadDashboardData() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/admin/list-keys`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ adminPass: storedAdminPass })
        });
        const data = await res.json();

        if (data.keys) {
          if (data.maintenance) {
            document.getElementById('maintStatus').value = data.maintenance.enabled ? "true" : "false";
            document.getElementById('maintMessage').value = data.maintenance.message;
          }

          const table = document.getElementById('keyTable');
          const countEl = document.getElementById('keyCount');
          const now = Date.now();
          const active = data.keys.filter(k => new Date(k.expiresAt).getTime() > now).length;

          countEl.innerText = `(${data.keys.length} total · ${active} active)`;

          if (data.keys.length === 0) {
            table.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#6b7280;">No keys found.</td></tr>`;
            return;
          }

          // Every key is listed — active and expired.
          table.innerHTML = data.keys.map(k => {
            const isExpired = new Date(k.expiresAt).getTime() <= now;
            const badge = isExpired
              ? `<span class="badge badge-expired">Expired</span>`
              : `<span class="badge badge-active">Active</span>`;
            const created = k.createdAt ? new Date(k.createdAt).toLocaleString() : "—";
            return `
              <tr>
                <td class="key-code">${k.key}</td>
                <td>${badge}</td>
                <td>${created}</td>
                <td>${new Date(k.expiresAt).toLocaleString()}</td>
                <td>
                  <button class="btn-revoke" onclick="revokeKey('${k.key}')">Revoke</button>
                </td>
              </tr>
            `;
          }).join('');
        }
      } catch (err) {
        console.error("Failed to load dashboard data");
      }
    }

    async function createKey() {
      const durationHours = document.getElementById('duration').value;

      const res = await fetch(`${BACKEND_URL}/api/admin/create-key`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ adminPass: storedAdminPass, durationHours })
      });

      const data = await res.json();
      if (data.success) {
        alert(`Success! Generated Key: ${data.record.key}`);
        loadDashboardData();
      } else {
        alert("Failed to create key.");
      }
    }

    async function revokeKey(key) {
      if (!confirm(`Are you sure you want to instantly revoke ${key}? The user will be cut off immediately.`)) return;

      const res = await fetch(`${BACKEND_URL}/api/admin/revoke-key`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ adminPass: storedAdminPass, key })
      });

      const data = await res.json();
      if (data.success) {
        alert(`Key ${key} revoked successfully.`);
        loadDashboardData();
      } else {
        alert(data.error || "Failed to revoke key.");
      }
    }

    async function updateMaintenance() {
      const enabled = document.getElementById('maintStatus').value === "true";
      const message = document.getElementById('maintMessage').value;

      const res = await fetch(`${BACKEND_URL}/api/admin/maintenance`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ adminPass: storedAdminPass, enabled, message })
      });

      const data = await res.json();
      if (data.success) {
        alert("Maintenance mode updated successfully! Live client portals will reflect this instantly.");
        loadDashboardData();
      } else {
        alert("Failed to update maintenance mode.");
      }
    }
  </script>
</body>
</html>
