<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER X SILENT — Admin Control Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #030712; color: #f3f4f6; min-height: 100vh; padding: 2rem; background-image: radial-gradient(circle at 50% 0%, #0f172a 0%, #030712 80%); }
    .container { max-width: 720px; margin: 0 auto; background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 2.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    h1 { font-size: 1.85rem; font-weight: 800; color: #38bdf8; text-align: center; margin-bottom: 2rem; }
    
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #9ca3af; margin-bottom: 0.5rem; }
    input, select { width: 100%; padding: 0.85rem 1rem; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(3, 7, 18, 0.6); color: #fff; font-size: 0.95rem; outline: none; }
    input:focus, select:focus { border-color: #38bdf8; }
    
    .btn { width: 100%; padding: 1rem; border-radius: 12px; border: none; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
    .btn-create { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #fff; margin-top: 0.5rem; }
    .btn-create:hover { opacity: 0.95; }
    .btn-refresh { background: rgba(255, 255, 255, 0.05); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); margin-top: 1.5rem; margin-bottom: 1rem; }

    table { width: 100%; border-collapse: collapse; margin-top: 1rem; border-radius: 12px; overflow: hidden; }
    th, td { padding: 1rem; text-align: left; font-size: 0.85rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    th { background: rgba(3, 7, 18, 0.8); color: #38bdf8; font-weight: 700; }
    td { background: rgba(17, 24, 39, 0.4); }
    .key-code { font-family: monospace; font-weight: 700; color: #4ade80; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Admin Control Panel</h1>

    <div class="form-group">
      <label>Admin Password</label>
      <input type="password" id="adminPass" placeholder="Enter CYBER_ADMIN_PASSWORD_999">
    </div>

    <div class="form-group">
      <label>Key Validity Duration</label>
      <select id="duration">
        <option value="1">1 Hour Trial</option>
        <option value="24" selected>24 Hours (1 Day)</option>
        <option value="168">7 Days</option>
        <option value="720">30 Days</option>
      </select>
    </div>

    <button class="btn btn-create" onclick="createKey()">Generate Access Key</button>

    <button class="btn btn-refresh" onclick="loadKeys()">Refresh Key Database</button>

    <table>
      <thead>
        <tr>
          <th>Generated Key</th>
          <th>Expires At</th>
        </tr>
      </thead>
      <tbody id="keyTable">
        <tr><td colspan="2" style="text-align:center; color:#6b7280;">Enter admin password & click refresh</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const BACKEND_URL = "https://cyber-x-silent-server.onrender.com";

    async function createKey() {
      const adminPass = document.getElementById('adminPass').value;
      const durationHours = document.getElementById('duration').value;

      if (!adminPass) {
        alert("Please enter the Admin Password.");
        return;
      }

      const res = await fetch(`${BACKEND_URL}/api/admin/create-key`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ adminPass, durationHours })
      });

      const data = await res.json();
      if (data.success) {
        alert(`Success! Generated Key: ${data.record.key}`);
        loadKeys();
      } else {
        alert(data.error || "Failed to create key.");
      }
    }

    async function loadKeys() {
      const adminPass = document.getElementById('adminPass').value;
      if (!adminPass) {
        alert("Please enter the Admin Password.");
        return;
      }

      const res = await fetch(`${BACKEND_URL}/api/admin/list-keys`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ adminPass })
      });

      const data = await res.json();
      if (data.keys) {
        const table = document.getElementById('keyTable');
        table.innerHTML = data.keys.map(k => `
          <tr>
            <td class="key-code">${k.key}</td>
            <td>${new Date(k.expiresAt).toLocaleString()}</td>
          </tr>
        `).join('');
      } else {
        alert(data.error || "Unauthorized password.");
      }
    }
  </script>
</body>
</html>
